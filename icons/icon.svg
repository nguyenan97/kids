<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B81"/>
      <stop offset="50%" stop-color="#FFA502"/>
      <stop offset="100%" stop-color="#1DD1A1"/>
    </linearGradient>
    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED049"/>
      <stop offset="100%" stop-color="#F59F00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Inner Soft Card -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Letter A -->
  <text x="256" y="325" font-family="'Fredoka', 'Comic Neue', sans-serif" font-weight="900" font-size="280" fill="#FF4757" text-anchor="middle">A</text>

  <!-- Sparkles -->
  <text x="100" y="140" font-size="52">⭐</text>
  <text x="390" y="130" font-size="52">✨</text>
  <text x="380" y="410" font-size="52">🍎</text>

  <!-- Cute Pencil Icon in Corner -->
  <g transform="translate(110, 340) rotate(-35) scale(0.9)">
    <rect x="0" y="0" width="160" height="40" rx="8" fill="url(#pencilGrad)"/>
    <polygon points="160,0 210,20 160,40" fill="#FFEAA7"/>
    <polygon points="195,14 210,20 195,26" fill="#2D3436"/>
    <rect x="-30" y="0" width="30" height="40" rx="6" fill="#FF6B81"/>
    <rect x="-5" y="0" width="10" height="40" fill="#B2BEC3"/>
  </g>
</svg>
